[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "schrodinger-solver"
version = "0.1.0"
description = "Finite-difference & spectral solvers for the 1-D Schrödinger equation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["schrodinger"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
