[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-algorithms"
version = "0.1.0"
description = "A from-scratch NumPy statevector simulator with Grover, teleportation, and Deutsch-Jozsa"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["qsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
